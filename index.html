<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>올더뮤 브랜드 디자인 챕터 · 2026 Q4–2027 사업계획</title><style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#FAFAFC; --text:#1D1D1F; --text2:#6E6E73; --text3:#8E8E93;
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.28);
  --accent:#732ED9; --accent-2:#9B6BE6; --accent-3:#D9C7F5; --accent-soft:rgba(115,46,217,.10);
  --risk:#C8102E; --risk-soft:rgba(200,16,46,.08); --gate:#1F3A68; --launch:#D99A00; --event:rgba(60,60,67,.10);
  --wk:13px; --label:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --surface:#1C1C1E; --surface2:#232326; --text:#F5F5F7; --text2:#A1A1A6; --text3:#7C7C80;
    --sep:rgba(235,235,245,.14); --sep-strong:rgba(235,235,245,.26);
    --accent:#A77BF0; --accent-2:#8C5FE0; --accent-3:#4E3580; --accent-soft:rgba(167,123,240,.16);
    --risk:#FF6B6B; --risk-soft:rgba(255,107,107,.12); --gate:#8FB0E8; --launch:#F0B830; --event:rgba(235,235,245,.10);
  }
}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1C1C1E; --surface2:#232326; --text:#F5F5F7; --text2:#A1A1A6; --text3:#7C7C80;
  --sep:rgba(235,235,245,.14); --sep-strong:rgba(235,235,245,.26);
  --accent:#A77BF0; --accent-2:#8C5FE0; --accent-3:#4E3580; --accent-soft:rgba(167,123,240,.16);
  --risk:#FF6B6B; --risk-soft:rgba(255,107,107,.12); --gate:#8FB0E8; --launch:#F0B830; --event:rgba(235,235,245,.10);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;padding:28px 14px;border-right:1px solid var(--sep);background:var(--surface2);position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 10px 22px}.brand b{display:block;font-size:15px}.brand span{display:block;color:var(--text2);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:14px}
.nav button:hover{background:var(--event)}
.nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.side-foot{margin:26px 10px 0;font-size:12px;color:var(--text2);line-height:1.6}
main{flex:1;min-width:0;padding:36px 40px 64px}
.view{display:none;max-width:1320px}.view.on{display:block}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:17px;margin:32px 0 10px;font-weight:650}
.lede{color:var(--text2);margin:0;max-width:80ch}
.panel{background:var(--surface);border:1px solid var(--sep);border-radius:14px}
.pad{padding:18px 20px}
/* tree */
.tree{width:100%;border-collapse:collapse;font-size:13.5px}
.tree th{font-size:12px;color:var(--text2);font-weight:600;text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--sep)}
.tree td{padding:9px 14px;border-bottom:1px solid var(--sep);vertical-align:top}
.tree tr:last-child td{border-bottom:none}
.tree td.n{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.node{display:flex;gap:8px;align-items:flex-start}
.node .bar{flex:none;width:2px;align-self:stretch;background:var(--accent-3);border-radius:1px}
.lv0 td{background:var(--accent-soft);font-weight:650}
.lv1 .lab{font-weight:650}.lv2 .lab{font-weight:600}
.lab small{display:block;color:var(--text2);font-weight:400;font-size:12px}
.ref td{color:var(--text3)}.ref .lab{font-weight:400}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--accent);color:#fff;margin:0 4px 4px 0;white-space:nowrap}
.chip.muted{background:var(--event);color:var(--text2)}
/* summary cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kgrid .panel{padding:16px 18px}
.kgrid b{display:block;font-size:20px;letter-spacing:-.01em;margin-top:2px}
.kgrid span{font-size:12.5px;color:var(--text2)}
/* projects */
.proj{border-bottom:1px solid var(--sep)}
.proj:last-child{border-bottom:none}
.proj summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(220px,1.3fr) minmax(220px,1.2fr) 1fr 1fr 1fr;gap:14px;padding:14px 18px;align-items:start}
.proj summary::-webkit-details-marker{display:none}
.proj summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.proj summary:hover{background:var(--surface2)}
.ph{display:grid;grid-template-columns:44px minmax(220px,1.3fr) minmax(220px,1.2fr) 1fr 1fr 1fr;gap:14px;padding:10px 18px;font-size:12px;color:var(--text2);font-weight:600;background:var(--surface2);border-bottom:1px solid var(--sep);border-radius:14px 14px 0 0}
.rank{font-size:18px;font-weight:700;color:var(--accent)}
.pname b{display:block;font-size:14.5px}.pname span{display:block;font-size:12px;color:var(--text2);margin-top:2px}
.imp{font-size:13px}.imp b{color:var(--accent)}
.stage{font-size:12.5px;color:var(--text)}
.proj[open] summary{background:var(--surface2)}
.ws{padding:4px 18px 18px 76px}
.ws table{width:100%;border-collapse:collapse;font-size:13px}
.ws th{text-align:left;font-size:12px;color:var(--text2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--sep-strong)}
.ws td{padding:8px 10px;border-bottom:1px solid var(--sep);vertical-align:top}
.ws ul{margin:0;padding-left:16px}.ws li{margin:2px 0}
.hint{font-size:12px;color:var(--text2);margin:10px 0 0}
/* gantt */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 12px}
.seg{display:inline-flex;background:var(--event);border-radius:9px;padding:2px}
.seg button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 11px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent)}
.gwrap{overflow-x:auto;border:1px solid var(--sep);border-radius:14px;background:var(--surface)}
.g{min-width:calc(var(--label) + var(--wk) * 64)}
.gr{display:flex;border-bottom:1px solid var(--sep)}
.gr:last-child{border-bottom:none}
.gl{width:var(--label);flex:none;padding:6px 12px;position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--sep);font-size:12.5px;line-height:1.35}
.gl b{display:block;font-size:12.5px}
.gl small{display:block;font-size:11px;color:var(--text2)}
.gt{position:relative;width:calc(var(--wk) * 64);flex:none;min-height:28px;
  background-image:linear-gradient(to right,var(--sep) 1px,transparent 1px);background-size:calc(var(--wk) * 4.345) 100%}
.gh .gl,.gh .gt{background-color:var(--surface2)}
.gg .gl{background:var(--surface2);color:var(--accent);font-weight:650}
.gg .gt{background-color:var(--surface2);min-height:26px}
.mh{position:absolute;top:4px;font-size:11px;font-weight:650;color:var(--text);padding-left:3px;border-left:1px solid var(--sep-strong);height:18px;white-space:nowrap}
.wkn{position:absolute;bottom:3px;font-size:9px;color:var(--text3);width:var(--wk);text-align:center}
.b{position:absolute;top:6px;height:16px;border-radius:4px;background:var(--accent-2);font-size:10.5px;line-height:16px;color:#fff;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b.soft{background:var(--accent-3);color:var(--text)}
.b.ms{width:10px!important;height:10px;top:9px;border-radius:2px;transform:rotate(45deg);padding:0}
.b.launch{background:var(--launch)}
.b.gate{background:var(--gate)}
.b.ev{background:var(--event);color:var(--text2)}
.b.risk{background:var(--risk)}
.lbl{position:absolute;top:6px;font-size:10.5px;color:var(--text2);white-space:nowrap;line-height:16px}
.g.only .gr.dim{display:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 2px 0;font-size:12px;color:var(--text2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
/* sim */
.simgrid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px}
.field{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep)}
.field:last-child{border-bottom:none}
.field label{font-size:13px}.field label small{display:block;color:var(--text2);font-size:11.5px}
.field input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--sep-strong);border-radius:8px;background:var(--surface);color:var(--text);text-align:right;width:100%}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.presets button{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--sep-strong);background:var(--surface);color:var(--text);cursor:pointer}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.out .panel{padding:14px 16px}.out span{font-size:12px;color:var(--text2)}.out b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.verdict{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.verdict.bad{background:var(--risk-soft)}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--text2);font-weight:600;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--sep)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--sep);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
.tbl{overflow-x:auto}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{position:sticky;top:0;height:auto;width:100%;display:flex;gap:12px;overflow-x:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-right:none;border-bottom:1px solid var(--sep);z-index:10}
  .brand,.side-foot{display:none}.nav{flex-direction:row}.nav button{white-space:nowrap}
  main{padding:22px 16px 48px}
  .ph{display:none}
  .proj summary{grid-template-columns:36px 1fr}
  .proj summary>div:nth-child(n+3){grid-column:2}
  .ws{padding:4px 12px 14px}
  .simgrid{grid-template-columns:1fr}
  :root{--label:190px}
}
.gr.pfirst{border-top:1px solid var(--sep-strong)}
.gl .stg{display:inline-block;font-size:10px;color:var(--text2);background:var(--event);border-radius:4px;padding:0 5px;margin-right:5px;font-weight:600}
.tgt td.pri{font-weight:700;color:var(--accent)}
.tgt td small{display:block;color:var(--text3);font-size:11px}
.ax{border:1.5px solid var(--accent)}

/* quarter roadmap */
.qs{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;min-width:960px}
.qc{position:relative;background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:16px 16px 14px}
.qc:not(:last-child)::after{content:"";position:absolute;right:-9px;top:34px;width:8px;height:8px;border-top:2px solid var(--accent-2);border-right:2px solid var(--accent-2);transform:rotate(45deg)}
.qc .q{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.02em}
.qc h3{margin:4px 0 2px;font-size:19px;letter-spacing:-.02em;color:var(--accent)}
.qc .sub{font-size:12.5px;color:var(--text);margin:0 0 10px;font-weight:600}
.qc ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.5}
.qc .gate{margin-top:10px;font-size:11.5px;color:var(--gate);font-weight:600;border-top:1px solid var(--sep);padding-top:8px}
.qc.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sl{display:grid;grid-template-columns:140px repeat(5,minmax(170px,1fr));min-width:990px;border:1px solid var(--sep);border-radius:14px;background:var(--surface);overflow:hidden}
.sl>div{padding:10px 12px;border-bottom:1px solid var(--sep);border-right:1px solid var(--sep);font-size:12.5px;line-height:1.45}
.sl>div:nth-child(6n){border-right:none}
.sl .h{background:var(--surface2);font-size:12px;font-weight:650;color:var(--text2)}
.sl .h b{display:block;color:var(--accent);font-size:13px}
.sl .ch{font-weight:650;background:var(--surface2)}
.sl .ch small{display:block;font-weight:400;color:var(--text2);font-size:11px}
.sl ul{margin:0;padding-left:14px}.sl li{margin:2px 0}
.bdg{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:5px;margin:3px 4px 0 0;white-space:nowrap}
.bdg.pmf{background:var(--gate);color:#fff}
.bdg.sku{box-shadow:inset 0 0 0 1.3px var(--accent);color:var(--accent)}
.bdg.big{background:var(--accent);color:#fff}
.pmf td b{display:block}
.skus{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sk{background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:16px 18px}
.sk h3{margin:0 0 4px;font-size:15px}.sk p{margin:0 0 10px;font-size:12.5px;color:var(--text2)}
.sk table{width:100%;border-collapse:collapse;font-size:12.5px}
.sk td{padding:7px 0;border-top:1px solid var(--sep);vertical-align:top}
.sk td:first-child{width:46%;font-weight:600;padding-right:10px}
.sk td small{display:block;color:var(--text2);font-weight:400}

/* summary roadmap (capture style) */
.rmk{font-size:14px;color:var(--text2);margin:0 0 22px;order:2}
.rmh{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.rm{--lab:150px;position:relative;min-width:1120px}
.rm-row{display:flex;align-items:center;min-height:48px}
.rm-lab{width:var(--lab);flex:none;font-size:14px;font-weight:650;padding-right:10px;line-height:1.3}
.rm-lab small{display:block;font-size:11px;font-weight:400;color:var(--text2)}
.rm-trk{position:relative;flex:1;height:38px}
.rm-mh .rm-trk{display:grid;grid-template-columns:repeat(15,1fr);height:34px}
.rm-mh .rm-trk div{font-size:12.5px;color:var(--text2);display:flex;align-items:center;padding-left:8px}
.rm-ph .rm-trk{height:84px}
.rm-bar{position:absolute;top:2px;bottom:2px;border-radius:7px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;line-height:1.25;overflow:hidden}
.rm-ph .rm-bar{border-radius:0;top:0;bottom:0;font-size:13.5px;font-weight:650;flex-direction:column}
.rm-ph .rm-bar small{font-size:11px;font-weight:500;opacity:.85}
.c-g{background:var(--event);color:var(--text)!important}.c-y{background:var(--accent-3);color:var(--text)!important}.c-n{background:var(--accent)}.c-r{background:#4B1D99}.c-s{background:var(--accent-soft);color:var(--accent)!important;box-shadow:inset 0 0 0 1px var(--accent-3)}.c-t{background:var(--accent-2)}
.rm-np .rm-trk{display:grid;grid-template-columns:repeat(15,1fr);height:auto;min-height:38px}
.rm-np .rm-trk div{font-size:10.5px;color:var(--text2);line-height:1.3;padding:2px 4px;border-left:1px solid var(--sep)}
.rm-np .rm-trk div b{color:var(--text)}
.rm-gates{position:absolute;left:var(--lab);right:0;top:0;bottom:0;pointer-events:none}
.rm-gate{position:absolute;top:0;bottom:-64px;border-left:1.5px dashed var(--gate);z-index:2}
.rm-gl{position:absolute;bottom:-64px;transform:translateX(-50%);font-size:12px;color:var(--gate);font-weight:600;text-align:center;line-height:1.35;white-space:nowrap;background:var(--bg);padding:0 3px}
.rm-basis{display:flex;gap:10px;margin-top:84px;font-size:12.5px;color:var(--text2);min-width:1120px}
.rm-basis b{width:150px;flex:none;font-weight:500}
.rm-basis span{color:var(--text)}
.rm-call{margin-top:16px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 18px;font-size:14px}
.rm-call b{color:var(--accent);margin-right:8px}.rm-call em{font-style:normal;color:var(--risk);font-weight:650}
/* okr */
.okr{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px}
.ok{background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:16px 18px}
.ok h3{margin:0;font-size:16px}.ok .path{font-size:11.5px;color:var(--text2);margin:2px 0 10px}
.ok .obj{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.ok .obj b{color:var(--accent);margin-right:6px}
.ok table{width:100%;border-collapse:collapse;font-size:12.5px}
.ok th{font-size:11.5px;color:var(--text2);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--sep2,var(--sep))}
.ok td{padding:7px 6px;border-bottom:1px solid var(--sep);vertical-align:top}
.ok td:first-child{width:38%}
.ok .kpi{margin-top:10px;font-size:12px}.ok .kpi b{display:block;font-size:11.5px;color:var(--text2);margin-bottom:4px}
.ok .kpi span{display:inline-block;background:var(--event);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
/* monthly table (horizontal) */
.mt{border-collapse:separate;border-spacing:0;font-size:12.3px;background:var(--surface);min-width:calc(150px + 15 * 150px);table-layout:fixed}
.mt th,.mt td{border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);padding:8px 8px;vertical-align:top;line-height:1.45}
.mt th.mcol{width:150px;position:sticky;top:0;background:var(--surface2);font-size:13px;font-weight:700;text-align:left;z-index:1}
.mt th.mcol small{display:block;font-size:10px;font-weight:600;color:var(--accent)}
.mt .pcol{width:150px;position:sticky;left:0;background:var(--surface2);font-weight:650;font-size:12.8px;z-index:2}
.mt th.pcol{z-index:3;top:0}
.mt .gtc{box-shadow:inset 0 3px 0 var(--gate)}
.mt tr.krow td.k{font-size:11.5px;color:var(--text2);background:var(--surface)}
.mt tr.krow td.k b{display:block;color:var(--gate);font-size:11.5px}
.mt td.span{background:none}
.mt td.span .rg{display:block;font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:2px}
.mt ul{margin:0;padding-left:14px}.mt li{margin:1px 0}

.navsec{font-size:11.5px;font-weight:650;color:var(--text3);padding:18px 10px 4px;border-top:1px solid var(--sep);margin-top:10px}
.nav button:nth-of-type(n+4){font-size:13px;color:var(--text2)}
.nav button[aria-selected="true"]{color:var(--accent)!important}
/* simplified okr */
.cobj{background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:18px 20px}
.cobj .src{font-size:11.5px;color:var(--text2)}
.cobj .o{font-size:16px;font-weight:650;margin:4px 0 14px;line-height:1.5}
.krt{width:100%;border-collapse:collapse;font-size:12.8px}
.krt th{text-align:left;font-size:11.5px;color:var(--text2);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--sep)}
.krt td{padding:8px;border-bottom:1px solid var(--sep);vertical-align:top}
.krt tr:last-child td{border-bottom:none}
.krt td:first-child{font-weight:650;white-space:nowrap;width:120px}
.krt .fix{display:block;font-size:11px;color:#C00000;margin-top:2px}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-top:14px}
.pj{background:var(--surface);border:1px solid var(--sep);border-radius:14px;padding:14px 16px}

D PR/CAMPAIGN SERIES 문서는 아이디어 참고로만 취급합니다.","kpiUpdate":"10/8 숫자 반영: 딥글로우 PDP 1.57%→1.80%, 신규 유입→첫 구매 1.50%→2.0%→2.3%, 딥글로우 외 첫 구매 7%→15%→25%, 고액 첫 주문 26%→15% 이하. 각 수치는 서로 다른 분모·대상이며 프로젝트 OKR의 선행·연결 지표에서 구분합니다.","sourceConflicts":"본문·트래커 충돌 처리: TOP-KR1은 본문의 분기 월평균 판단을 유지합니다(트래커의 ‘행사 없는 달’ 표현 미적용). TOP-KR3는 자사몰 신제품 포함·중복 제거 기준을 유지합니다. 신규 12,000명은 성공 조건, 채널 동일점 +15%는 가정으로 표시합니다. L4의 행사 예외는 확정 전입니다. L7의 출시월은 KPI 원문의 옛 월 표기 대신 기존 최종 NPD 캘린더를 적용합니다."},"sources":[["출시·프로젝트 기준","기존 첨부 올더뮤 2027 신제품 출시·프로젝트 일정 최종 HTML"],["회사 목표·문제 진단","oldernew-growth-okr-2026-10-01-roadmap90.pdf 및 02. 35→50→65억 그로스 플랜"],["내부 공수","구간투입(검수중)·NPD 탭: 1 M/M=22 M/D. 신제품 기본 디자인 공수 39 M/D(1.77 M/M). 실제 투입 실적과 구분."],["일정 기준","브랜드 종료 2026년 11월 중순, 생산·입고 합산 4주. 일정·목표는 검토용 제안."],["KR·선행 지표 최신화","2026.10.08: 노션 02 그로스 플랜(본문 수정 10/7) 및 연결 OKR·KPI 트래커. 본문 상태 검토 중. 원천 실적 미재검증."],["레이아웃·인력 기준","2026.10.08 첨부 T1 프로젝트 브리핑 HTML의 화면 구조 참조. 첨부 조직도 현재 8명 및 사용자 지정 상반기 정규 증원 +3명 반영."]],"dataRevision":"briefing-layout-20261008","brief":{"companyObjective":"딥글로우 한 제품·자사몰 한 채널에 기대는 매출 구조를 바꾸고, 국내 월 순매출 2027.04 35억·2027년 4분기 월평균 50억과 전사 ROAS 목표를 함께 달성한다.","connections":["브랜드 리뉴얼 결과를 적용 가이드·기존 제품 교체·상세페이지·브랜드 스토어·매장 디자인으로 연결","신제품 패키지·제품 비교·입문 및 기획 세트를 출시 일정과 연결","자사몰 탐색·옵션·장바구니·회원·주문 화면을 첫 구매 여정 기준으로 개선","실물 촬영 기반 AI 시범을 반복 제작·검수·에셋 재사용과 연결"],"contribution":["구매 이유 전달 → 자사몰·브랜드 스토어 전환 및 동일점 판매 개선. 매출 기여액은 별도 가산하지 않음.","신제품·입문 구성 선택 → 신제품 신규 고객·매출, 딥글로우 외 첫 구매 비중 확대.","구매 단계 이탈 감소 → 첫 구매 전환·신규 주문 확대. MKT·MD와 공동 판단.","단위 제작비·승인 시간 개선 → 콘텐츠 비용 및 Full CAC 개선에 기여. AI 이미지의 판매 영향은 별도 비교."],"budgets":["패키지 교체·샘플·촬영·VMD 제작비: 교체 SKU·점포·사양·견적 확정 후 산정","신제품·세트 패키지·촬영·콘텐츠 제작비: SKU·구성·출시 배치별 산정","UX/UI 설계·개발·검증비: 개발 범위와 투입 방식 확정 후 산정","실물 촬영·AI 도구·외주·재작업 비용: 동일 품질·수량 조건으로 비교"],"milestones":["26.11 중순 브랜드 기준 인수 → 27.01 우선 교체 생산·촬영 → 02 판매 이미지 전환 제안. 이후 SKU별 전환.","제품별 패키지 7주·생산/입고 4주·촬영 4주·상세 6주. 확정 출시일에서 역산.","26.12 탐색 1차 적용 → 27.02 옵션·장바구니 → 03 주문 단계 → 05·08·10 개선.","26.4Q 실물 기반 시범·제작 기준 → 27.1Q 재사용·판매 비교 → 2Q 이후 반복 적용."],"dependenci const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(path,value,tag='span',cls='')=>`<${tag} class="edit-field ${cls}" data-path="${esc(JSON.stringify(path))}">${esc(value)}</${tag}>`;
const note=(key,warn=false)=>`<div class="callout ${warn?'warn':''}">${field(['notes',key],state.notes[key])}</div>`;
const badge=s=>`<span class="badge ${s==='기준 계획'?'plan':s==='미확정'?'pending':''}">${esc(s)}</span>`;
const fmt=s=>s?String(s).replaceAll('-','.').slice(2):'미확정';
const wk=s=>{const d=parseDate(s);if(!d)return '미확정';const m=new Date(d);m.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));const first=new Date(Date.UTC(m.getUTCFullYear(),m.getUTCMonth(),1));first.setUTCDate(1+((8-first.getUTCDay())%7));return `${String(m.getUTCFullYear()).slice(2)}.${String(m.getUTCMonth()+1).padStart(2,'0')} W${Math.floor((m-first)/604800000)+1}`};
function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;const d=new Date(s+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s?d:null;}
function iso(d){return d.toISOString().slice(0,10)}function addDays(s,n){const d=parseDate(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function monday(s){const d=parseDate(s);return addDays(s,-((d.getUTCDay()+6)%7))}

function table(headers,rows,cls=''){return `<div class="panel tbl table-wrap"><table class="t ${cls}"><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function head(n,title,sub){return `<div class="section-number">${n} / 2026 Q4 — 2027</div><h1>${title}</h1><p class="lede">${sub}</p>`}
function renderSummary(){const p=state.projects,b=state.brief;const row=(label,f)=>[`<b>${label}</b>`,...p.map(f)];return head('01','브리핑 요약',field(['title'],state.title)+' · '+field(['subtitle'],state.subtitle))+sourceLegend()+`<div class="rm-call">${field(['intro'],state.intro)}</div><h2>1. 회사 사업목표와 챕터 역할</h2><div class="cobj"><div class="src">회사 Objective · 노션 TOP OKR 기준</div><div class="o">${field(['brief','companyObjective'],b.companyObjective)}</div>${companyTable(true)}</div><h2>2. 사업계획 검토 및 프로젝트 구성</h2>${table(['프로젝트','구분','현재 진행 업무 연결 · 보완'],p.map((x,i)=>[`${esc(x.id)} · ${field(['projects',i,'n'],x.n)}`,i===3?'제작 경제성':'판매·구매 경험',field(['brief','connections',i],b.connections[i])]))}<h2>3. 주요 일정·선행 지표</h2>${table(['프로젝트','마일스톤','핵심 지표와 판정'],p.map((x,i)=>[esc(x.id)+' '+esc(x.n),field(['brief','milestones',i],b.milestones[i]),x.kr.map(k=>`<b>${esc(k.id)}</b> ${esc(k.target)}`).join('<br>')]))}<p class="hint">자세한 수치·산식·정보 상태는 05 프로젝트 OKR에서 수정합니다. 위 요약값은 프로젝트 지표를 참조합니다.</p><h2>4. 프로젝트별 브리핑</h2>${table(['항목',...p.map(x=>x.id+' '+x.n)],[row('사업 목표',(x,i)=>field(['projects',i,'purpose'],x.purpose)),row('매출 기여',(x,i)=>field(['brief','contribution',i],b.contribution[i])),row('핵심 실행 과제',(x,i)=>x.ws.map((w,j)=>`${esc(w.id)} ${field(['projects',i,'ws',j,'name'],w.name)}`).join('<br>')),row('타임라인·마일스톤',(x,i)=>field(['brief','milestones',i],b.milestones[i])),row('선행 KPI·판단 기준',(x,i)=>field(['projects',i,'metric'],x.metric)),row('PM·책임',(x,i)=>field(['projects',i,'pm'],x.pm)),row('참여 챕터',(x,i)=>field(['projects',i,'team'],x.team)),row('필요 인력',(x,i)=>i===0?'온라인·오프라인 공동 / 디렉터 품질 판단':i===1?'오프라인 패키지 + 온라인 출시 콘텐츠':i===2?'온라인 UX/UI · 개발 협업':'온라인 콘텐츠·AI / 촬영 협업'),row('예산 · 산정 필요',(x,i)=>field(['brief','budgets',i],b.budgets[i])),row('선후관계·협업',(x,i)=>field(['brief','dependencies',i],b.dependencies[i]))],'brief-matrix')}<h2>5. 인력 T.O</h2>${renderStaffBoard()}<h2>6. 담당 범위·자료</h2><div class="panel pad"><p>${field(['brief','scope'],b.scope)}</p><p class="hint">${field(['brief','roles'],b.roles)}</p></div><details><summary>기준 자료와 수치 해석</summary>${note('summary')}${note('sourceConflicts',true)}${table(['구분','자료'],state.sources.map((r,i)=>r.map((v,j)=>field(['sources',i,j],v))))}</details>`+footer()}
function companyTable(topOnly=false){return table(['회사 KR','2026.12','2027.04','2027년 4분기'],state.company.map((r,i)=>({r,i})).filter(({r})=>!topOnly||r.id.startsWith('TOP')).map(({r,i})=>[`${esc(r.id)} · ${field(['company',i,'name'],r.name)}`,...r.targets.map((v,j)=>field(['company',i,'targets',j],v))]),'krt')}
function controls(type){return `<div class="toolbar"><div class="seg" role="group" aria-label="보기 눈금"><button data-zoom="month" aria-pressed="${ui.zoom==='month'}">월 단위</button><button data-zoom="week" aria-pressed="${ui.zoom==='week'}">주 단위</button></div><select data-ui="range" aria-label="표시 기간"><option value="all">전체 · 26.10~27.12</option><option value="q4">2026년 4분기</option><option value="h1">2027년 상반기</option><option value="h2">2027년 하반기</option></select>${type==='project'?`<select data-ui="project" aria-label="프로젝트 필터"><option value="all">모든 프로젝트</option>${state.projects.map(p=>`<option value="${p.id}">${esc(p.id+' '+p.n)}</option>`).join('')}</select>`:''}${type==='campaign'?'<select data-ui="campaign" aria-label="캠페인 유형"><option value="all">브랜드·시즌 전체</option><option>브랜드</option><option>시즌</option></select>':''}<input data-ui="search" placeholder="제품·워크스트림 검색" value="${esc(ui.search)}" aria-label="일정 검색"><button class="edit-only" data-add="${type}">+ ${type==='npd'?'제품':type==='campaign'?'캠페인':'업무'} 추가</button></div>`}
function range(){return ui.range==='q4'?['2026-10-01','2026-12-31']:ui.range==='h1'?['2027-01-01','2027-06-30']:ui.range==='h2'?['2027-07-01','2027-12-31']:['2026-10-01','2027-12-31']}
function roadmap(rows,type,milestones=[]){const [rs,re]=range(),a=+parseDate(rs),b=+parseDate(re)+864e5,span=b-a;let bins=[],d=rs;while(+parseDate(d)<b){let e;if(ui.zoom==='week')e=addDays(monday(d),7);else{const x=parseDate(d);e=iso(new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)))}if(+parseDate(e)>b)e=addDays(re,1);bins.push({start:d,end:e,label:ui.zoom==='week'?wk(d):d.slice(2,7).replace('-','.')});d=e}
 const pct=date=>(+parseDate(date)-a)/span*100,grid=bins.map(x=>`<i class="rm-gridline" style="left:${pct(x.start)}%"></i>`).join('');
 const clip=(s,e)=>{if(!parseDate(s)||!parseDate(e))return null;const x=Math.max(a,+parseDate(s)),y=Math.min(b,+parseDate(e)+864e5);return y>x?{left:(x-a)/span*100,width:(y-x)/span*100}:null};
 const qdates=[['2026-10-01','2026-12-31'],['2027-01-01','2027-03-31'],['2027-04-01','2027-06-30'],['2027-07-01','2027-09-30'],['2027-10-01','2027-12-31']];
 const phases=qdates.map(([s,e],i)=>{const c=clip(s,e);return c?`<div class="rm-bar phase-${i}" style="left:${c.left}%;width:${c.width}%"><b>${esc(state.quarters[i][0])}</b><span class="cp">${field(['roadmapPhases',type,i],state.roadmapPhases[type][i])}</span></div>`:''}).join('');
 let lastGroup='';const visible=rows.filter(r=>(!ui.search||(r.label+' '+r.sub+' '+r.bars.map(x=>x.label).join(' ')).toLowerCase().includes(ui.search.toLowerCase()))&&r.bars.some(z=>clip(z.start,z.end)));
 const lanes=visible.map(r=>{let h='';if(r.group&&r.group!==lastGroup){h=`<div class="rm-group">${esc(r.group)}</div>`;lastGroup=r.group}const height=Math.max(46,(r.lanes||1)*22+12);return h+`<div class="rm-row"><div class="rm-lab">${esc(r.label)}<small>${esc(r.sub)}</small></div><div class="rm-trk" style="height:${height}px">${grid}${r.bars.map(z=>{const c=clip(z.start,z.end);if(!c)return '';return `<button class="rm-bar task ${z.cls||'package'} ${z.start===z.end?'point':''}" style="left:${c.left}%;width:${z.start===z.end?'11px':c.width+'%'};top:${(z.lane||0)*22+6}px;height:18px" title="${esc(z.label+' · '+fmt(z.start)+'~'+fmt(z.end)+' · '+wk(z.start)+'~'+wk(z.end))}" data-record="${esc(z.kind||r.kind)}" data-index="${z.index??r.index}" aria-label="${esc(r.label+' '+z.label+' 일정 수정')}">${z.start===z.end?'':esc(z.label)}</button>`}).join('')}</div></div>`}).join('');
 const marks=milestones.length&&ui.zoom==='month'?`<div class="rm-row rm-month-items"><div class="rm-lab">${type==='npd'?'제품 출시':'캠페인 적용'}<small>날짜별 주요 일정</small></div><div class="rm-trk">${bins.map(x=>`<div style="width:${(+parseDate(x.end)-+parseDate(x.start))/span*100}%">${milestones.filter(m=>m.date>=x.start&&m.date<x.end).map(m=>`<button class="month-item" data-record="${m.kind}" data-index="${m.index}"><b>${fmt(m.date).slice(3)}</b> ${esc(m.name)}</button>`).join('')||'—'}</div>`).join('')}</div></div>`:'';
 const gates=[['2026-12-31','26.12 효율 회복'],['2027-04-30','27.04 성장 판단'],['2027-08-31','27.08 ATL 준비'],['2027-12-31','27.4Q 결과 판단']].filter(x=>x[0]>=rs&&x[0]<=re);
 return `<div class="road-scroll"><div class="rm" style="min-width:${Math.max(1040,bins.length*(ui.zoom==='week'?65:83)+220)}px"><div class="rm-row rm-mh"><div class="rm-lab">${visible.length}개 항목</div><div class="rm-trk">${bins.map(x=>`<div style="width:${(+parseDate(x.end)-+parseDate(x.start))/span*100}%">${esc(x.label)}</div>`).join('')}</div></div><div class="rm-row rm-ph"><div class="rm-lab">추진 단계<small>기준 수립 → 적용 → 확대</small></div><div class="rm-trk">${phases}</div></div>${marks}${lanes||'<p class="empty">해당 기간에 일정이 없습니다.</p>'}<div class="rm-row rm-gate-labels"><div class="rm-lab">회사 판단 시점</div><div class="rm-trk">${gates.map(([s,t])=>`<span class="gate-label" style="left:${Math.min(96,pct(s))}%">${t}</span>`).join('')}</div></div><div class="rm-guides">${gates.map(([s])=>`<i style="left:${Math.min(99.8,pct(s))}%"></i>`).join('')}</div></div></div>`}
function timeline(rows){return roadmap(rows,'npd')}
function npdRows(){return state.npd.map((n,i)=>({label:n.product,sub:`입고 ${n.inbound_month} · 출시 ${fmt(n.launch)}`,kind:'npd',index:i,lanes:4,bars:[{start:n.package_start,end:addDays(n.final_file,-1),label:'패키지',cls:'package',lane:0},{start:n.final_file,end:addDays(n.inbound_proposal,-1),label:'생산·입고',cls:'production',lane:1},{start:n.photo_start,end:addDays(n.photo_start,25),label:'촬영·보정',cls:'photo',lane:2},{start:n.pdp_start,end:addDays(monday(n.launch),-3),label:'상세페이지',cls:'pdp',lane:3},{start:n.launch,end:n.launch,label:'출시',cls:'launch',lane:0}]}))}
function calendarLegend(type){return `<div class="legend">${(type==='npd'?[['var(--accent)','패키지'],['var(--accent-3)','생산·입고'],['#AD8C45','촬영·보정'],['#558680','상세페이지'],['var(--launch)','출시']]:type==='campaign'?[['var(--accent-2)','판매 접점 준비'],['var(--gate)','캠페인·행사 운영']]:[['var(--accent)','기준·시범·적용'],['var(--accent-3)','개선·운영']]).map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`}
function recordButton(kind,i){return `<button class="small" data-record="${kind}" data-index="${i}">일정 수정</button>`}
function setTable(type){return table(['대상','패키지 착수 → 데이터','납품 관리일','콘텐츠 착수','적용일','편집'],state.sets.map((r,i)=>({r,i})).filter(x=>x.r.type===type).map(({r,i})=>[esc(r.name),fmt(r.package_start)+' → '+fmt(r.final_file),fmt(r.inbound),fmt(r.content_start),fmt(r.launch),recordButton('sets',i)]))}
function renderNpd(){return head('02','신제품 출시 캘린더','최종 NPD 입고·출시 계획에 연결한 디자인 프로세스 로드맵입니다.')+controls('npd')+calendarLegend('npd')+roadmap(npdRows(),'npd',state.npd.map((n,i)=>({name:n.product,date:n.launch,kind:'npd',index:i})))+`<div class="rm-call"><b>리드타임</b>${field(['notes','npd'],state.notes.npd)}</div><details><summary>제품별 날짜·조건 상세</summary>${table(['제품','입고월 / 관리일','출시','패키지 → 데이터','촬영','상세 / 선택 안내','상태·편집'],state.npd.map((r,i)=>[esc(r.product),esc(r.inbound_month)+' / '+fmt(r.inbound_proposal),fmt(r.launch),fmt(r.package_start)+' → '+fmt(r.final_file),fmt(r.photo_start),fmt(r.pdp_start)+' / '+fmt(r.comparison_start),badge(r.status)+' '+recordButton('npd',i)]))}</details><h2>출시 연계 세트 패키지</h2>${setTable('출시')}<h2>판매채널 VMD 적용</h2>${table(['채널·대상','준비 → 설치 검수','적용일','조건','편집'],state.vmd.map((r,i)=>[esc(r.name),fmt(r.start)+' → '+fmt(r.end),fmt(r.launch),esc(r.note),recordButton('vmd',i)]))}`+footer()}
function renderCampaign(){const rows=state.campaigns.map((r,i)=>({label:r.name,sub:r.type+' · '+r.status,kind:'campaigns',index:i,lanes:2,bars:[{start:r.prep_start,end:r.prep_end,label:'판매 접점 준비',cls:'package',lane:0},{start:r.start,end:r.end,label:'운영·적용',cls:'campaign',lane:1}]})).filter(r=>ui.campaign==='all'||state.campaigns[r.index].type===ui.campaign);return head('03','캠페인 캘린더','브랜드·시즌 캘린더와 자사몰·브랜드 스토어·담당 매장 디자인 준비를 연결합니다.')+controls('campaign')+calendarLegend('campaign')+roadmap(rows,'campaign',state.campaigns.map((r,i)=>({name:r.name,date:r.start,kind:'campaigns',index:i})))+`<div class="rm-call">${field(['notes','campaign'],state.notes.campaign)}</div><details><summary>캠페인·행사 날짜 상세</summary>${table(['캠페인','유형','준비','운영·적용','편집'],state.campaigns.map((r,i)=>[esc(r.name),esc(r.type),fmt(r.prep_start)+' → '+fmt(r.prep_end),fmt(r.start)+' → '+fmt(r.end),recordButton('campaigns',i)]))}</details><h2>시즌 세트 패키지</h2>${setTable('시즌')}`+footer()}
function renderProject(){const rows=state.projects.filter(p=>ui.project==='all'||p.id===ui.project).flatMap(p=>p.ws.map(w=>({group:p.id+' '+p.n,label:w.id+' '+w.name,sub:w.purpose,lanes:2,bars:state.tasks.map((t,i)=>({t,i})).filter(x=>x.t.ws===w.id).map(({t,i})=>({start:t.start,end:t.end,label:t.name,cls:t.type==='운영'?'ops':'package',lane:t.type==='운영'?1:0,kind:'tasks',index:i}))})));return head('04','프로젝트 캘린더','프로젝트 → 워크스트림 단위로 공통 기준·시범 개선·반복 운영을 정리했습니다.')+controls('project')+calendarLegend('project')+roadmap(rows,'project')+`<div class="rm-call">${field(['notes','project'],state.notes.project)}</div><h2>워크스트림 목적·범위·협업</h2>${state.projects.filter(p=>ui.project==='all'||p.id===ui.project).map(p=>{const i=state.projects.indexOf(p);return `<details open><summary>${esc(p.id+' '+p.n)}</summary>${table(['워크스트림','목적·범위','초기 일정','후속 일정·선행 조건'],p.ws.map((w,j)=>[esc(w.id)+' '+field(['projects',i,'ws',j,'name'],w.name),field(['projects',i,'ws',j,'purpose'],w.purpose)+'<br><small>'+field(['projects',i,'ws',j,'scope'],w.scope)+'</small>',field(['projects',i,'ws',j,'early'],w.early),field(['projects',i,'ws',j,'later'],w.later)+'<br><small>'+field(['projects',i,'ws',j,'dependency'],w.dependency)+'</small>']))}</details>`}).join('')}<details><summary>전체 업무·날짜 목록</summary>${table(['프로젝트 / 워크스트림','업무','날짜','주차','편집'],state.tasks.map((r,i)=>[esc(r.project+' / '+r.ws),esc(r.name),fmt(r.start)+' → '+fmt(r.end),wk(r.start)+'~'+wk(r.end),recordButton('tasks',i)]))}</details>`+footer()}
function renderLeading(p,i){return `<h3 class="subheading">선행 KPI·연결성 관리 지표</h3>${table(['지표·구분','기준값','2026.12','2027.04','2027년 4분기'],(p.leading||[]).map((r,j)=>[`${esc(r.code)} ${field(['projects',i,'leading',j,'name'],r.name)}<small>${field(['projects',i,'leading',j,'role'],r.role)}</small>`,field(['projects',i,'leading',j,'baseline'],r.baseline),...r.targets.map((v,k)=>field(['projects',i,'leading',j,'targets',k],v))]),'krt leading-table')}<details><summary>선행 지표 산식·판정 조건·출처</summary>${(p.leading||[]).map((r,j)=>`<div class="measure-row"><b>${esc(r.code+' '+r.name)}</b><p>${field(['projects',i,'leading',j,'definition'],r.definition)}</p><p class="hint">${field(['projects',i,'leading',j,'interpretation'],r.interpretation)}</p><small>${field(['projects',i,'leading',j,'cadence'],r.cadence)} · ${field(['projects',i,'leading',j,'sourceStatus'],r.sourceStatus)} · ${String(r.source).startsWith('https://')?`<a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">노션 원문</a>`:''}</small></div>`).join('')}</details><p class="hint">${field(['projects',i,'kpiNote'],p.kpiNote||'')}</p>`}
function renderOkr(){return head('05','프로젝트 OKR','회사 목표 → 프로젝트 Objective → 결과 KR → 선행·연결 지표 순서입니다.')+`<div class="cobj" style="margin-top:20px"><div class="src">회사 Objective · 노션 TOP OKR / 2026.10.08 수치 반영</div><div class="o">${field(['brief','companyObjective'],state.brief.companyObjective)}</div>${companyTable()}</div><h2>챕터 프로젝트 OKR</h2><p class="hint">${field(['notes','okr'],state.notes.okr)}</p><div class="okw">${state.projects.map((p,i)=>`<article class="okc" id="okr-${p.id}"><div class="okh"><span class="okn">${p.id}</span><div><div class="oko">${field(['projects',i,'o'],p.o)}</div><div class="okl">프로젝트 · ${field(['projects',i,'n'],p.n)}<br>회사 KR 연결 · ${field(['projects',i,'company'],p.company)}</div></div></div>${table(['결과 KR','정보 상태','현재 기준값','목표값','측정 결과','산식·근거 데이터'],p.kr.map((k,j)=>[`${esc(k.id)} ${field(['projects',i,'kr',j,'result'],k.result)}`,tagText(i===0&&j===0?'본문 근거 + 제안':'DSG 제안','a'),field(['projects',i,'kr',j,'baseline'],k.baseline),field(['projects',i,'kr',j,'target'],k.target),field(['projects',i,'kr',j,'actual'],k.actual),field(['projects',i,'kr',j,'formula'],k.formula)]),'krt okt')}<details><summary>KR별 측정 책임·성과 판단</summary>${table(['KR','담당 챕터','성과 판단'],p.kr.map((k,j)=>[esc(k.id),field(['projects',i,'kr',j,'owner'],k.owner),field(['projects',i,'kr',j,'decision'],k.decision)]))}<p>${field(['projects',i,'baseline'],p.baseline)}</p><p>${field(['projects',i,'guard'],p.guard)}</p></details><div class="indicator-pair"><div><small>직접 대표 관리 지표</small>${field(['projects',i,'metric'],p.metric)}</div><div><small>연결성 관리 지표</small>${field(['projects',i,'link'],p.link)}</div></div>${renderLeading(p,i)}<p class="hint">${field(['projects',i,'direct'],p.direct)}</p></article>`).join('')}</div><details><summary>본문·트래커의 상이한 표현 처리</summary>${note('sourceConflicts',true)}</details>`+footer()}

function validState(x){try{
 const texts=(r,keys)=>r&&typeof r==='object'&&keys.every(k=>typeof r[k]==='string');
 if(!x||x.schema!==base.schema||x.documentId!==base.documentId||!texts(x,['title','subtitle','intro','savedAt'])||!Number.isFinite(Date.parse(x.savedAt)))return false;
 if(!['company','npd','campaigns','tasks','sets','vmd','quarters','sources','projects'].every(k=>Array.isArray(x[k])))return false;
 if(!texts(x.notes,['summary','resource','npd','campaign','project','okr','decisions']))return false;
 if(!x.company.every(r=>texts(r,['id','name'])&&Array.isArray(r.targets)&&r.targets.length===3&&r.targets.every(v=>typeof v==='string')))return false;
 if(!['quarters','sources'].every(k=>x[k].every(r=>Array.isArray(r)&&r.length===2&&r.every(v=>typeof v==='string'))))return false;
 if(x.projects.length!==4||!x.projects.every((p,i)=>p.id===base.projects[i].id&&texts(p,['n','purpose','o','link','direct','company','pm','team','metric','baseline','guard'])&&Array.isArray(p.ws)&&p.ws.length===base.projects[i].ws.length&&p.ws.every((w,j)=>w.id===base.projects[i].ws[j].id&&texts(w,['name','purpose','scope','early','later','dependency']))&&Array.isArray(p.kr)&&p.kr.length===3&&p.kr.every(k=>texts(k,['id','result','target','formula','owner','baseline','actual','decision']))))return false;
 for(const p of x.projects)if(p.leading!==undefined&&(!Array.isArray(p.leading)||!texts(p,['kpiNote'])||!p.leading.every(r=>texts(r,['code','name','role','baseline','definition','interpretation','source','cadence','sourceStatus'])&&Array.isArray(r.targets)&&r.targets.length===3&&r.targets.every(v=>typeof v==='string'))))return false;
 for(const kind of ['npd','campaigns','tasks','sets','vmd'])for(const r of x[kind]){
   if(!r||typeof r!=='object'||forms[kind].some(([k,,type])=>type!=='number'&&typeof r[k]!=='string')||validateRecord(kind,r))return false;
   if(kind==='npd'&&!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.inbound_month))return false;
 }
 if(!x.staff||!Array.isArray(x.staff.positions)||!Array.isArray(x.staff.quarters)||x.staff.quarters.length!==5||!x.staff.positions.every(r=>texts(r,['id','name','unit','kind','note'])&&!validateRecord('staff',r)))return false;
 if(!texts(x.staff,['note','budget','capacity'])||!texts(x.brief,['companyObjective','scope','roles']))return false;
 for(const key of ['connections','contribution','budgets','milestones','dependencies'])if(!Array.isArray(x.brief[key])||x.brief[key].length!==4||!x.brief[key].every(v=>typeof v==='string'))return false;
 if(!Array.isArray(x.brief.keyDecisions)||!x.brief.keyDecisions.every(r=>Array.isArray(r)&&r.length===3&&r.every(v=>typeof v==='string')))return false;
 if(!x.roadmapPhases||!['npd','campaign','project'].every(k=>Array.isArray(x.roadmapPhases[k])&&x.roadmapPhases[k].length===5&&x.roadmapPhases[k].every(v=>typeof v==='string')))return false;
 return true;
 }catch(e){return false}}

).hidden=isNew;$('#dialogHelp').textContent=kind==='staff'?'변경하면 모든 조직도·분기별 합계에 함께 반영됩니다. 채용 시점은 제안이며 개인명은 사용하지 않습니다.':'날짜는 제안입니다. 실제 납기·샘플·휴일 확인 후 적용하고 저장하세요.';$('#editor').showModal()}

function validateRecord(kind,r){if(kind==='staff'){if(!r.name?.trim())return '포지션명을 입력하세요.';if(!['챕터','온라인','오프라인'].includes(r.unit)||!['기존','신규','겸직'].includes(r.kind))return '파트·구분을 확인하세요.';if(![r.startQuarter,r.endQuarter].every(n=>Number.isInteger(n)&&n>=0&&n<=4)||r.startQuarter>r.endQuarter)return '시작·종료 분기를 확인하세요.';return ''}for(const [key,,type] of forms[kind]){if(type==='date'&&!parseDate(r[key]))return '올바른 날짜를 입력하세요.'}const pairs=kind==='npd'?[['package_start','final_file'],['final_file','inbound_proposal'],['pdp_start','launch'],['photo_start','launch'],['comparison_start','launch']]:kind==='sets'?[['package_start','final_file'],['final_file','inbound'],['inbound','launch'],['content_start','launch']]:[['start','end']];if(kind==='campaigns')pairs.push(['prep_start','prep_end'],['prep_end','start']);if(kind==='vmd')pairs.push(['end','launch']);if(pairs.some(([a,b])=>r[a]>r[b]))return '시작일·준비일이 종료일·적용일보다 늦습니다. 날짜를 확인하세요.';if(kind==='tasks'&&!state.projects.find(p=>p.id===r.project)?.ws.some(w=>w.id===r.ws))return '프로젝트에 속한 워크스트림을 선택하세요.';if(kind==='npd'&&(!Number.isInteger(r.units)||r.units<1))return '제작 단위는 1 이상의 정수로 입력하세요.';return ''}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab)switchTab(t.dataset.tab);if(t.dataset.zoom){ui.zoom=t.dataset.zoom;render()}if(t.dataset.addStaff){openEditor('staff',-1,true);if(editing)$('#recordForm').elements.unit.value=t.dataset.addStaff}if(t.dataset.go){switchTab(t.dataset.go);setTimeout(()=>document.getElementById('okr-'+t.dataset.project)?.scrollIntoView({behavior:'smooth',block:'start'}),10)}if(t.dataset.record)openEditor(t.dataset.record,Number(t.dataset.index));if(t.dataset.add)openEditor(t.dataset.add,-1,true)});
document.addEventListener('input',e=>{const t=e.target.closest('.edit-field');if(t&&editing){setAt(JSON.parse(t.dataset.path),t.textContent);updateStatus('수정 중 · 잠시 후 브라우저 자동 저장');clearTimeout(timer);timer=setTimeout(()=>persist(),500)}});
document.addEventListener('paste',e=>{if(editing&&e.target.closest('.edit-field')){e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)}});
document.addEventListener('change',e=>{const key=e.target.dataset.ui;if(key){ui[key]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportHtml()}});
$('#editToggle').onclick=()=>{editing=!editing;applyEdit();if(!editing){persist();render()}};
$('#saveBtn').onclick=exportHtml;$('#exportHtml').onclick=exportHtml;$('#moreBtn').onclick=()=>{$('#morePanel').hidden=!$('#morePanel').hidden;$('#moreBtn').setAttribute('aria-expanded',String(!$('#morePanel').hidden))};
$('#exportJson').onclick=()=>{persist();download('oldermew-plan-backup.json',JSON.stringify(state,null,2),'application/json')};$('#importJson').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>4000000)throw new Error('백업 파일이 너무 큽니다.');const x=JSON.parse(await f.text());for(const k of ['brief','staff','roadmapPhases'])if(!x[k])x[k]=structuredClone(base[k]);if(!validState(x))throw new Error('이 사업계획 형식의 백업 파일이 아닙니다.');for(const kind of ['npd','campaigns','tasks','sets','vmd'])for(const r of x[kind]){const error=validateRecord(kind,r);if(error)throw new Error('백업 일정 확인: '+error)}if(!confirm('현재 내용을 이 백업으로 교체할까요?'))return;state=x;persist();render();toast('백업을 불러왔습니다.')}catch(err){toast(err.message||'백업 불러오기에 실패했습니다.')}finally{e.target.value=''}};
$('#resetBtn').onclick=()=>{if(confirm('이 HTML 파일에 포함된 초기 내용으로 복원할까요? 현재 수정 내용은 먼저 백업할 수 있습니다.')){state=structuredClone(base);persist();render();toast('파일 내 초기 내용으로 복원했습니다.')}};
$('#printBtn').onclick=()=>{$$('details').forEach(d=>d.open=true);window.print()};$('#closeDialog').onclick=()=>$('#editor').close();
$('#recordForm').onsubmit=e=>{e.preventDefault();const r=readForm(),{kind,index,isNew}=dialogRecord;const error=validateRecord(kind,r);if(error){toast(error);return}if(isNew)records(kind).push({id:'custom-'+Date.now(),...r});else records(kind)[index]={...records(kind)[index],...r};persist();$('#editor').close();render();toast('변경 내용을 적용했습니다.')};
$('#deleteBtn').onclick=()=>{const {kind,index}=dialogRecord;if(confirm('이 항목을 삭제할까요? 인력 항목은 모든 분기의 조직도·합계에서도 제외됩니다.')){records(kind).splice(index,1);persist();$('#editor').close();render()}};
$('#recalcBtn').onclick=()=>{const f=$('#recordForm'),r=readForm();if(!/^\d{4}-\d{2}$/.test(r.inbound_month)||!parseDate(r.launch)){toast('입고월·출시일을 먼저 입력하세요.');return}if(!confirm('입고·출시일 기준으로 패키지·촬영·상세·선택 안내 날짜를 다시 계산할까요?'))return;let d=r.inbound_month+'-01',x=parseDate(d);d=addDays(d,(8-x.getUTCDay())%7);if(r.launch.slice(0,7)!==r.inbound_month)d=addDays(d,14);const lm=monday(r.launch),v={inbound_proposal:d,package_start:addDays(d,-77),final_file:addDays(d,-28),photo_start:addDays(lm,-35),pdp_start:addDays(lm,-42),comparison_start:addDays(lm,-21)};for(const [k,value]of Object.entries(v))f.elements[k].value=value;toast('제안 날짜를 역산했습니다. 샘플·휴일·납기를 확인 후 적용하세요.')};

let staffDrag=null,quarterDrag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.org-chip[data-position]');if(!editing||!c)return;staffDrag=Number(c.dataset.position);e.dataTransfer.setData('text/plain',String(staffDrag));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const box=e.target.closest('[data-drop-unit]');if(editing&&staffDrag!==null&&box){e.preventDefault();e.dataTransfer.dropEffect='move'}});
document.addEventListener('drop',e=>{const box=e.target.closest('[data-drop-unit]');if(!editing||staffDrag===null||!box)return;e.preventDefault();state.staff.positions[staffDrag].unit=box.dataset.dropUnit;staffDrag=null;persist();render();toast('파트 배치를 변경했습니다. 모든 분기에 함께 반영됩니다.')});
document.addEventListener('dragend',()=>staffDrag=null);
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.to-cell');if(!editing||!c||e.button!==0)return;e.preventDefault();quarterDrag={index:Number(c.dataset.position),start:Number(c.dataset.quarter),end:Number(c.dataset.quarter)};paintQuarterPreview()});
function paintQuarterPreview(){if(!quarterDrag)return;const lo=Math.min(quarterDrag.start,quarterDrag.end),hi=Math.max(quarterDrag.start,quarterDrag.end);$$('.to-cell').forEach(c=>{if(Number(c.dataset.position)===quarterDrag.index)c.classList.toggle('preview',Number(c.dataset.quarter)>=lo&&Number(c.dataset.quarter)<=hi)})}
document.addEventListener('pointermove',e=>{if(!quarterDrag)return;const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.to-cell');if(c&&Number(c.dataset.position)===quarterDrag.index){quarterDrag.end=Number(c.dataset.quarter);paintQuarterPreview()}});
document.addEventListener('pointerup',()=>{if(!quarterDrag)return;const r=state.staff.positions[quarterDrag.index];r.startQuarter=Math.min(quarterDrag.start,quarterDrag.end);r.endQuarter=Math.max(quarterDrag.start,quarterDrag.end);quarterDrag=null;persist();render()});
document.addEventListener('pointercancel',()=>{quarterDrag=null;$$('.to-cell.preview').forEach(c=>c.classList.remove('preview'))});
document.addEventListener('keydown',e=>{const c=e.target.closest?.('.to-cell');if(editing&&c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEditor('staff',Number(c.dataset.position))}});
// Synchronize fields repeated in briefing, OKR and organization views on blur.
document.addEventListener('focusout',e=>{const f=e.target.closest?.('.edit-field');if(!editing||!f)return;$$('.edit-field').forEach(el=>{if(el!==f&&el.dataset.path===f.dataset.path)el.textContent=f.textContent})});
try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(validState(saved)&&new Date(saved.savedAt)>new Date(base.savedAt)){state=saved;lastSaved='기존 수정본 복원'}}catch(e){}
if(['summary','npd','campaign','project','okr','to'].includes(location.hash.slice(1)))activeTab=location.hash.slice(1);
render();switchTab(activeTab);
</script>
